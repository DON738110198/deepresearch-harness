[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-free-deepresearch-harness"
version = "0.1.0"
description = "Auditable, training-free deep research harnesses for OpenAI-compatible LLM APIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deepresearch-harness = "deepresearch_harness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

